<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podium</title>
<link rel="icon" id="favicon">
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --card-2: #fbfbfd; --glass: rgba(255,255,255,.72);
  --text: #1d1d1f; --text-2: #515154; --text-3: #6e6e73;
  --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.14);
  --accent: #0071e3; --accent-soft: rgba(0,113,227,.10);
  --green: #28a745; --green-dot: #34c759; --green-soft: rgba(52,199,89,.12);
  --amber: #c27c00; --amber-dot: #ff9f0a; --amber-soft: rgba(255,159,10,.14);
  --red: #d70015; --red-soft: rgba(255,59,48,.10);
  --purple: #8250df; --purple-soft: rgba(130,80,223,.12);
  --gray-soft: rgba(142,142,147,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.06);
  --shadow-hi: 0 2px 4px rgba(0,0,0,.06), 0 14px 36px rgba(0,0,0,.12);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --card-2: #232325; --glass: rgba(28,28,30,.72);
    --text: #f5f5f7; --text-2: #b8b8bd; --text-3: #8e8e93;
    --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
    --accent: #2997ff; --accent-soft: rgba(41,151,255,.16);
    --green: #30d158; --green-dot: #30d158; --green-soft: rgba(48,209,88,.16);
    --amber: #ffb340; --amber-dot: #ff9f0a; --amber-soft: rgba(255,159,10,.18);
    --red: #ff6961; --red-soft: rgba(255,69,58,.16);
    --purple: #b392f0; --purple-soft: rgba(163,113,247,.18);
    --gray-soft: rgba(142,142,147,.20);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --shadow-hi: 0 2px 4px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --card-2: #232325; --glass: rgba(28,28,30,.72);
  --text: #f5f5f7; --text-2: #b8b8bd; --text-3: #8e8e93;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --accent: #2997ff; --accent-soft: rgba(41,151,255,.16);
  --green: #30d158; --green-dot: #30d158; --green-soft: rgba(48,209,88,.16);
  --amber: #ffb340; --amber-dot: #ff9f0a; --amber-soft: rgba(255,159,10,.18);
  --red: #ff6961; --red-soft: rgba(255,69,58,.16);
  --purple: #b392f0; --purple-soft: rgba(163,113,247,.18);
  --gray-soft: rgba(142,142,147,.20);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  --shadow-hi: 0 2px 4px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.55);
}
:root { color-scheme: light dark; } :root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
}
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { margin: 0 auto; padding: 6px 12px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; column-gap: 14px; row-gap: 4px; align-items: center; }
.topbar-inner > .logo { grid-row: 1; }
.topbar-inner > .corner { grid-column: 3; grid-row: 1; justify-self: end; align-self: start; display: flex; align-items: center; gap: 8px; }
.corner .bell { width: 26px; height: 26px; }
.controls { grid-column: 1 / 4; grid-row: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.controls #feed-toggle { margin-left: auto; }
.logo { width: 34px; height: 34px; flex: none; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand .eyebrow { display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.brand h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.theme { display: inline-flex; background: var(--gray-soft); border-radius: 9px; padding: 2px; gap: 2px; }
.theme button { border: 0; background: transparent; border-radius: 7px; padding: 3px 8px; font-size: 11px; color: var(--text-2); cursor: pointer; }
.theme button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 600px) { .theme button { padding: 4px 7px; } }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.eyebrow .live { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px; }
.restart { margin-left: 8px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 11.5px; font-weight: 600; text-transform: none; letter-spacing: 0; cursor: pointer; }
.restart:hover { background: var(--accent); color: #fff; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green-dot); }
.live.off i { background: var(--red); }
.live.idle i { background: var(--amber-dot); }
.human { display: inline-flex; align-items: center; gap: 2px; background: var(--gray-soft); border-radius: 999px; padding: 2px; font-size: 12px; white-space: nowrap; }
.human button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.human .state { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.human button i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); opacity: .45; }
.human .state i { opacity: 1; }
.human .available i { background: var(--green-dot); }
.human .mobile i { background: var(--accent); }
.human .unavailable i { background: var(--text-3); }
.human .until { font-weight: 400; color: var(--text-2); }
.share { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12px; color: var(--text); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.share i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); opacity: .45; }
.share.on i { background: var(--green-dot); opacity: 1; }
.crew { display: inline-flex; align-items: center; }
.crew .av { position: relative; width: 26px; height: 26px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--card); display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; color: #fff; cursor: default; }
.crew .av:first-child { margin-left: 0; }
.crew .av.me { box-shadow: 0 0 0 2px var(--accent); z-index: 1; }
.crew .av.more { background: var(--gray-soft); color: var(--text-2); }
.crew .av i { position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--green-dot); border: 2px solid var(--card); }
@media (max-width: 720px) { .human .until, .human .flip { display: none; } }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; display: none; }

.page { margin: 0 auto; padding: 20px 24px 48px; display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; align-items: start; }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }

.stepper { display: flex; align-items: center; padding: 14px 18px; gap: 0; overflow-x: auto; scrollbar-width: none; }
.step { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1.5px solid var(--line-2); color: var(--text-3); flex: none; }
.step.past { color: var(--text-2); }
.step.past .dot { background: var(--text); border-color: var(--text); color: var(--card); }
.step.now { color: var(--text); font-weight: 650; }
.step.now .dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
.step-bar { flex: 1 0 18px; height: 1.5px; background: var(--line-2); margin: 0 10px; min-width: 18px; }
.step-bar.past { background: var(--text); }

.banner { border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid transparent; }
.banner .label { font-weight: 650; font-size: 15px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.banner .sub { color: var(--text-2); font-size: 13px; }
.banner.working { background: var(--green-soft); border-color: rgba(52,199,89,.25); }
.banner.needs { background: var(--amber-soft); border-color: rgba(255,159,10,.35); }
.banner.done { background: var(--gray-soft); color: var(--text-2); }
.banner.assumed { background: var(--accent-soft); border-color: rgba(0,113,227,.22); flex-direction: column; align-items: stretch; gap: 6px; }
.banner.assumed .assumed-list { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 420px; overflow-y: auto; }
.banner.assumed li { padding: 6px 0; border-top: 1px solid rgba(0,113,227,.15); }
.banner.assumed li .row { display: flex; gap: 10px; align-items: center; cursor: pointer; border-radius: 8px; }
.banner.assumed li .row:hover .q { color: var(--accent); }
.banner.assumed li .q { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner.assumed .ams { font-size: 11px; font-weight: 700; color: var(--text-2); background: var(--gray-soft); border-radius: 5px; padding: 1px 6px; margin-right: 8px; }
.banner.assumed .chev { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; border-radius: 8px; background: rgba(0,113,227,.08); color: var(--accent); cursor: pointer; transition: transform .15s; }
.banner.assumed .chev:hover { background: rgba(0,113,227,.12); }
.banner.assumed li.open .chev { transform: rotate(180deg); }
.banner.assumed .more { margin: 6px 36px 4px 34px; display: grid; gap: 4px; color: var(--text-2); }
.banner.assumed .more .k { display: inline-block; min-width: 70px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); }
.banner.assumed li:first-child { border-top: none; }
.banner.assumed li .sub { margin-left: 4px; }
.banner.assumed .aid { display: inline-block; min-width: 26px; color: var(--accent); }
.banner.assumed .ashared { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; margin-right: 8px; }
.banner.assumed .settle { display: flex; gap: 6px; flex: none; }
.banner.assumed .confirm-all { align-self: flex-start; }
.banner.assumed .settle .btn { padding: 3px 11px; font-size: 12px; }
.banner.assumed .settled { flex: none; font-size: 12px; font-weight: 600; color: var(--green); white-space: nowrap; }
.banner.assumed .settled.reverse { color: var(--amber); }
.banner.idle { background: var(--card); border-color: var(--line); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.wchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; font-size: 13px; box-shadow: var(--shadow); }
a.wchip { color: inherit; text-decoration: none; }
.wchip:hover { border-color: var(--line-2); }
.wchip b { font-weight: 600; }
.pr-chip { cursor: default; }
.pr-link { color: inherit; text-decoration: none; cursor: pointer; }
.looked { display: inline-flex; align-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid var(--line); font-size: 12px; color: var(--text-2); cursor: pointer; }
.looked input { margin: 0; width: 12px; height: 12px; accent-color: var(--accent); cursor: pointer; }
.stage { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--gray-soft); color: var(--text-2); }
.stage.RED { background: var(--red-soft); color: var(--red); }
.stage.GREEN { background: var(--green-soft); color: var(--green); }
.stage.REFACTOR { background: var(--accent-soft); color: var(--accent); }
.stage.FIX { background: var(--amber-soft); color: var(--amber); }
.tw-tot { float: right; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 650; font-size: 12.5px; }
.tw-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 2px 0 12px; }
.tw-bar i { display: block; height: 100%; min-width: 3px; }
.tw { display: grid; grid-template-columns: 10px auto minmax(0, 1fr) auto 36px; gap: 7px 10px; align-items: baseline; font-size: 13px; }
.tw .d { width: 9px; height: 9px; border-radius: 3px; align-self: center; }
.tw .n { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tw .m { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.tw .p { color: var(--text-3); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.tw-foot { margin-top: 8px; font-size: 11.5px; color: var(--text-3); }

.cycle { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; }
.bar3 { display: inline-flex; gap: 3px; }
.bar3 i { width: 14px; height: 4px; border-radius: 2px; background: var(--gray-soft); }
.bar3 i.on { background: var(--green-dot); }
.node .doing { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.node .doing .bar3 { margin-left: auto; }
.node .doing.why { display: block; color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .since { color: var(--text-3); font-variant-numeric: tabular-nums; }
.agentlink { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
.agentlink:hover { text-decoration: underline; }
.pulse { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--green-dot); flex: none; }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--green-dot); animation: pulse 1.8s ease-out infinite; }
.pulse.amber, .pulse.amber::after { background: var(--amber-dot); }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }

.toolbar { position: sticky; top: var(--bar-h, 0px); z-index: 10; background: var(--bg); padding: 6px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; box-shadow: var(--shadow); height: 40px; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); font-size: 14px; min-width: 0; }
.search input::placeholder { color: var(--text-3); }
.kbd { font-size: 11px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; }
.seg { display: inline-flex; background: var(--gray-soft); border-radius: 10px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.seg .n { color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums; }

.dsbtn { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 7px; border-radius: 999px; background: var(--card-2); color: var(--text-2); border: 1px solid var(--line-2); font: inherit; font-size: 12px; font-weight: 600; line-height: 18px; letter-spacing: 0; text-transform: none; white-space: nowrap; cursor: pointer; }
.dsbtn:hover { border-color: var(--accent); color: var(--accent); }
.dsbtn.has { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.dsbtn.has:hover { background: var(--accent); color: #fff; }
.dsbtn.busy { cursor: default; border-style: dashed; }
.dsbtn.busy:hover { border-color: var(--line-2); color: var(--text-2); }
.dsbtn.busy i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: dsp 1s ease-in-out infinite; }
@keyframes dsp { 50% { opacity: .25; } }
.map-card.ds-on > :not(#ds-view) { display: none; }
#ds-view { display: none; }
.map-card.ds-on #ds-view { display: block; animation: dsin .22s ease-out; }
@keyframes dsin { from { opacity: 0; transform: translateX(24px); } }
.ds-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ds-back { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px 5px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.ds-back:hover { border-color: var(--accent); }
.ds-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.ds-title .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.ds-title b { font-size: 16px; font-weight: 680; }
.ds-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ds-tabs { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
.ds-tab { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2); font: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.ds-tab.on { background: var(--text); color: var(--card); border-color: var(--text); font-weight: 600; }
.ds-tab .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.ds-meta { padding: 8px 18px 0; font-size: 12.5px; color: var(--text-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ds-meta .chip { padding: 1px 8px; border-radius: 6px; background: var(--gray-soft); font-size: 11.5px; }
.ds-meta .when { margin-left: auto; color: var(--text-3); }
.ds-empty { padding: 40px 18px; text-align: center; color: var(--text-2); }
/* the picture is drawn for paper, so it stays on white in dark mode too */
.ds-paper { margin: 12px 18px 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: auto; max-height: calc(100vh - 240px); min-height: min(60vh, 520px); text-align: center; cursor: zoom-in; }
.ds-paper img { max-width: 100%; height: auto; display: inline-block; padding: 12px; }
.ds-paper.zoom { cursor: zoom-out; }
.ds-paper.zoom img { max-width: none; }

.map-card { padding: 0; overflow: clip; }
.map-head { position: sticky; top: calc(var(--bar-h, 0px) + var(--toolbar-h, 0px)); z-index: 5; background: var(--card); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 18px 8px; transition: box-shadow .15s; }
.map-head.stuck { box-shadow: 0 6px 10px -8px rgba(0,0,0,.35); }
.map-sentinel { height: 1px; margin-bottom: -1px; pointer-events: none; }
.map-head h2 { flex: 1; min-width: 0; }
.map-head .legend { flex: none; white-space: nowrap; }
.mini { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); cursor: pointer; font-size: 12.5px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.mini:hover { border-color: var(--accent); }
.mini-l { color: var(--accent); font-weight: 600; white-space: nowrap; }
.mpills { display: flex; gap: 4px; }
.mpill { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--text-2); background: var(--card); white-space: nowrap; }
.mpill[data-drill]:hover { border-color: var(--accent); color: var(--accent); }
.mpill.done { background: var(--gray-soft); border-color: transparent; color: var(--text-3); }
.mpill.working { border-color: var(--green-dot); color: var(--green); }
.mpill.waiting { border-style: dashed; }

.qlinks { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; }

.asanabtn.linkasana { background: var(--card-2); color: var(--text-3); border-color: var(--line-2); cursor: pointer; font-family: inherit; }

.quality > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-weight: 600; }

.qsum { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; color: var(--text-2); }
.qpill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--gray-soft); white-space: nowrap; }

.qgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; border-top: 1px solid var(--line); }

<script>
const DEFAULT_PHASES = [
  ["recon", "Recon"], ["spec", "Spec"], ["mock", "Mock"], ["architecture", "Architecture"],
  ["stories", "Stories"], ["build", "Build"], ["gate", "Quality gate"], ["verify", "Verify"], ["land", "Land"],
];
function phases() {
  const own = S.project?.orchestrator?.phases;
  if (!Array.isArray(own) || !own.length) return DEFAULT_PHASES;
  const known = dict(DEFAULT_PHASES);
  return own.map((p) => (Array.isArray(p) ? [String(p[0]), String(p[1] ?? p[0])] : [String(p), known[p] || String(p).charAt(0).toUpperCase() + String(p).slice(1).replace(/[-_]/g, " ")]));
}
const maxAttempts = () => Number(S.project?.orchestrator?.maxAttempts) || 2;
const orch = () => [S.info?.orchestrator, S.project?.orchestrator].find((o) => o?.command) || null;
const orchCmd = () => orch()?.command || "";

const FEED = {

function feedEvents() {
  const f = S.feedFilter || "all", types = FEED[f];

  const commitOf = new Map();
  S.events.forEach((e) => { if (e.type === "commit" && e.story) commitOf.set(key(e.milestone || "", e.story), e); });
  const out = [];
  for (const e of S.events.slice().reverse()) {

    if (f !== "commits" && e.type === "commit" && e.story && merged.has(key(e.milestone || "", e.story))) continue;

function digestBanner() {

  const ended = new Set(of("merged", "failed").map(id));
  const moves = [...new Map(of("planned", "phase", "landed").map((e) => [e.milestone, e])).values()];
  const shown = ["merged", "failed", "dispatched", "planned", "phase", "landed", "pr"];
  const rows = [
    ["Merged", uniq(of("merged")).map(story).join("")],
    ["Failed", uniq(of("failed")).map((e) => `${story(e)}<span class="dwhy">${esc(e.reason || "")}</span>`).join("")],
    ["Started", uniq(of("dispatched")).filter((e) => !ended.has(id(e))).map(story).join("")],
    ["Milestones", moves.map((e) => `<span class="wchip" data-drill="${esc(e.milestone || "")}"><b>${esc(e.milestone || "")}</b> ${e.type === "phase" ? `→ ${esc(phaseLabel(e.phase))}` : e.type === "landed" ? "landed" : "planning started"}</span>`).join("")],
    ["PRs", [...new Map(of("pr").map((e) => [`${e.milestone}:${e.repo || ""}:${e.number}`, e])).values()].map((e) => prPill(e, e.milestone)).join("")],
    ["Other", ev.filter((e) => !shown.includes(e.type)).map((e) => `<div class="dline">${(EV[e.type] || [0, 0, () => esc(e.text || e.type)])[2](e)}</div>`).join("")],
  ].filter(([, html]) => html);
  if (!rows.length) return "";
  return `<div class="banner digest"><span class="label">While you were away</span><span class="sub">since ${esc(when(new Date(S.digestSince).toISOString()))}</span><button class="btn ghost" data-digest-done>Got it</button><div class="drows">${rows.map(([k, html]) => `<div class="drow"><span class="k">${k}</span><div class="dv">${html}</div></div>`).join("")}</div></div>`;
}

function attention() {
  const P = S.project, out = [];
  if (!P) return out;
  if (P.needsYou) out.push([`needs:${P.needsYou.reason}`, `Needs you: ${P.needsYou.reason}`, "amber"]);
  msList().forEach((m) => { if (waitingOn(m).length) out.push([`wait:${m.id}`, `${m.id}'s planning recommends doing ${waitingOn(m).map((w) => w.id).join(", ")} first`, "amber"]); });
  prsToReview().forEach((pr) => {
    out.push([`pr:${prKey(pr.ms, pr.repo, pr.number)}`, `${pr.ms} draft PR #${pr.number} to review`, "amber"]);
    lookedBy(pr).forEach((who) => out.push([`looked:${prKey(pr.ms, pr.repo, pr.number)}:${who}`, `${who} looked at ${pr.ms} #${pr.number}`, "amber"]));
  });

    if (s.status === "approval") out.push([`p:${m.id}/${s.id}`, `${m.id} · ${s.id} waits for approval`, "amber"]);

  return out;
}

function phaseTimes(m) {
  const evs = S.events.filter((e) => e.milestone === m.id && ["planned", "phase", "landed"].includes(e.type))
    .map((e) => ({ ...e, t: Date.parse(e.at) })).filter((e) => !isNaN(e.t)).sort((a, b) => a.t - b.t);
  const out = dict();
  evs.forEach((e, i) => {
    const p = e.type === "phase" ? e.phase : e.type === "planned" && !evs.some((x) => x.phase === "recon") ? "recon" : null;
    if (!p) return;
    const next = evs[i + 1];
    const end = next ? next.t : m.status === "done" ? null : Date.now();
    if (end == null) return;
    const o = (out[p] ||= { ms: 0, start: e.t, open: false });
    o.ms += end - e.t;
    o.open = !next;
  });
  return out;
}
function waveTimes(m) {
  const st = m.stories || [], by = dict(st.map((s) => [s.id, s])), depth = dict();
  const d = (s, seen = new Set()) => {
    if (depth[s.id]) return depth[s.id];
    if (seen.has(s.id)) return 0;
    seen.add(s.id);
    return (depth[s.id] = 1 + Math.max(0, ...[...(s.deps || []), ...(s.overlapAfter || [])].filter((x) => by[x]).map((x) => d(by[x], seen))));
  };
  const waves = [];
  st.forEach((s) => {
    if (!s.startedAt) return;
    const a = Date.parse(s.startedAt), b = s.finishedAt ? Date.parse(s.finishedAt) : Date.now(), w = d(s) - 1;
    const o = (waves[w] ||= { start: a, end: b, n: 0, open: false });
    o.start = Math.min(o.start, a); o.end = Math.max(o.end, b); o.n++; o.open ||= !s.finishedAt;
  });
  return waves;
}
const shortDur = (ms) => { const m = Math.round(ms / 60000); return m < 1 ? "<1m" : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ""}`; };
function timelineSec(m) {
  const pt = phaseTimes(m), wv = waveTimes(m);
  const rows = phases().filter(([k]) => pt[k]).map(([k, label]) => ({ k, label, ...pt[k] }));
  if (!rows.length) return "";
  // scaled to the finished phases, so a phase still waiting (on the user, say) doesn't flatten the rest; it fills the bar
  const done = [...rows.filter((r) => !r.open).map((r) => r.ms), ...wv.filter((w) => w && !w.open).map((w) => w.end - w.start)];
  const max = Math.max(1, ...(done.length ? done : rows.map((r) => r.ms)));
  const row = (label, ms, open, cls = "") => `<div class="trow ${cls} ${open ? "open" : ""}"><span class="tk">${label}</span><span class="tbar"><i style="width:${Math.min(100, Math.max(1.5, (ms / max) * 100))}%"></i></span><span class="tv">${dur(ms)}${open ? " so far" : ""}</span></div>`;
  const total = rows.reduce((n, r) => n + r.ms, 0);
  return `<div class="sec"><h3>Timeline<span class="muted tsum">${dur(total)} in all</span></h3><div class="tl">${rows.map((r) =>
    row(esc(r.label), r.ms, r.open) + (r.k === "build" ? wv.map((w, i) => (w ? row(`Wave ${i + 1} <span class="muted">· ${w.n}</span>`, w.end - w.start, w.open, "wave") : "")).join("") : "")).join("")}</div></div>`;
}

    toast(action === "assign" ? `${id} is yours — prompt copied; the orchestrator leaves it alone until you take it back` : `Prompt for ${id} copied — paste it in another session`);
    if (action === "assign") poll();

    toast("Couldn't copy the prompt — is the Podium server running? Start it with podium server --detach");

}
async function restartServer() {
  try { await fetch("/restart", { method: "POST" }); } catch { return toast("The Podium server didn't answer — start it again with podium server --detach"); }
  toast("Restarting the Podium server…");
  for (let i = 0; i < 20; i++) {
    await new Promise((r) => setTimeout(r, 500));
    try { if (!(await (await fetch("/info", { cache: "no-store" })).json()).stale) return location.reload(); } catch { /* still restarting */ }
  }

}
async function act(action, id) {
  const path = ["assign", "plan", "human", "domain-story", "build-all", "stop", "claim", "proceed"].includes(action) ? `/${action}/${idPath(id)}` : `/${action}`;
  try {
    const r = await fetch(path, { method: "POST" });
    if (action === "claim" && !r.ok) return toast(`Couldn't claim ${id}: ${(await r.text()).trim() || r.status}`);
    if (r.status === 409) return toast(NO_ORCHESTRATOR());
    if (!r.ok) throw new Error(r.status);
    if (action === "domain-story") { S.dsAsked = { __proto__: null, ...S.dsAsked, [id]: Date.now() }; render(); setTimeout(render, 121000); }
    if (action === "proceed") { S.proceedAsked = { __proto__: null, ...S.proceedAsked, [id]: Date.now() }; render(); setTimeout(render, 121000); }
    if (action === "plan") { S.planAsked = { __proto__: null, ...S.planAsked, [id]: Date.now() }; render(); setTimeout(render, 121000); }
    if (action === "human") { S.human = await r.json(); renderHuman(); return toast({ available: "You're available — the orchestrator brings its questions to you", mobile: "On mobile — questions only when they block, pictures instead of Podium links", unavailable: "You're away — the orchestrator keeps going and records its decisions", auto: "Back on your hours" }[id]); }
    toast({ assign: `Queued ${id} — the orchestrator picks it up next`, plan: `Planning ${id} — answer its questions in the orchestrator's chat`, "build-all": `Build all queued for ${id} — wave by wave`, "domain-story": `Drawing ${id} as domain stories — it opens from the Story button when ready`, stop: `${id} stops after this wave`, claim: `Claiming ${id} — it shows as yours once the claim is saved`, proceed: `Going ahead with ${id} — the orchestrator carries on and mocks what's missing`, share: S.project?.sync?.enabled ? "Queued: the orchestrator prints the colleague's steps in its chat" : "Sharing queued: the orchestrator turns sync on and prints the colleague's steps in its chat" }[action]);

const LINK_PORT = 8765;
function sheetRoute() {
  const sel = S.doc ? S.back[0]?.id : S.selected, vm = viewMs(), enc = encodeURIComponent;
  let head = "", label = "", doc = S.doc;
  if (sel === "__quest") [head, label] = ["/quest", "the quest"];
  else if (sel === "__root" && !vm) [head, label] = [`/epic/${enc(S.epicView)}`, `epic ${S.epicView}`];
  else if (sel === "__root") [head, label] = [`/${enc(vm.id)}`, vm.id];
  else if (!vm && msById()[sel]) [head, label] = [`/${enc(sel)}`, sel];
  else if (vm && byId()[sel]) [head, label] = [`/${enc(vm.id)}/${enc(sel)}`, `${vm.id}/${sel}`];
  else if (!doc) {
    const path = document.querySelector(`[data-open="${CSS.escape(sel)}"]`)?.dataset.path;
    doc = path ? { path, base: "runDir" } : null;
  }
  if (!head && !doc) return null;
  const tail = doc ? `/${doc.base === "repoDir" ? "repo" : "doc"}/${doc.path.split("/").map(enc).join("/")}` : "";
  return { hash: `#${head}${tail}`, label: doc ? `${head ? `${label}'s document` : "document"} ${doc.path}` : label };
}
async function copyLink() {
  const r = sheetRoute();
  if (!r) return toast("Nothing to link to on this sheet");
  const url = (S.info?.run ? `http://127.0.0.1:${LINK_PORT}/open?run=${S.info.run}` : `${location.origin}/`) + r.hash;
  try { await navigator.clipboard.writeText(url); } catch {
    const t = Object.assign(document.createElement("textarea"), { value: url });
    document.body.append(t); t.select();
    const ok = document.execCommand("copy");
    t.remove();
    if (!ok) return toast("Couldn't copy the link");
  }
  toast(`Link copied — opens ${r.label} in their Podium`);
}
function parseRoute() {
  const segs = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!segs.length) return null;
  let d;
  try { d = segs.map(decodeURIComponent); } catch { return { bad: true }; }
  const at = d.findIndex((x, i) => i < 3 && (x === "doc" || x === "repo"));
  const head = at < 0 ? d : d.slice(0, at);
  return { head, doc: at < 0 ? null : { base: d[at] === "repo" ? "repoDir" : "runDir", path: d.slice(at + 1).join("/") } };
}
async function goTo(r) {
  const none = (what) => toast(`This run has no ${what}`);
  const [a, b] = r.head || [];
  const badPath = r.doc && (!r.doc.path || r.doc.path.includes("\\") || r.doc.path.split("/").some((x) => !x || x === "." || x === ".."));
  if (r.bad || r.head.length > 2 || badPath || (!a && !r.doc)) return toast("That link isn't one this Podium understands");
  if (a === "quest" && !b) { if (!S.epic) return none("quest"); await openSheet("__quest"); }
  else if (a === "epic" && b) {
    if (!S.project.epics.some((x) => x.id === b)) return none(`epic ${b}`);
    S.epicView = b; S.epic = epicCtx(b); S.view = null;
    await openSheet("__root");
  } else if (a) {
    if (!epicOfMs(a)) return none(`milestone ${a}`);
    enterEpicOf(a);
    if (S.epic.single) render(); else setView(a);
    if (b && !byId()[b]) return none(`story ${a}/${b}`);
    await openSheet(b || "__root");
  } else {
    if (!S.epic) return none("epic to show it in");
    await openSheet("__root");
  }
  if (r.doc) await openDoc(r.doc.path, r.doc.base);
}
function followLink() {
  if (!S.route || !S.project) return;
  const r = S.route;
  S.route = null;
  goTo(r).catch(() => toast("Couldn't open that link"));
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }

document.addEventListener("click", (ev) => {
  if (ev.target.closest("a[href]")) return;
  if (ev.target.closest("a.pr")) return;
  const th = ev.target.closest("[data-theme-set]");
  if (th) { setTheme(th.dataset.themeSet); return; }
  const rl = ev.target.closest("[data-release]");
  if (rl) { ev.stopPropagation(); release(rl.dataset.release); return; }
  if (ev.target.closest("[data-restart]")) { restartServer(); return; }
  const hideBtn = ev.target.closest("[data-hide-finished]");
  if (hideBtn) { const scope = hideBtn.dataset.hideFinished; setHideFinished(scope, !S.hideFinished[scope]); render(); return; }
  if (ev.target.closest("[data-fetch]")) { fetchShared(); return; }
  if (ev.target.closest("[data-ds-back]")) { closeDs(); return; }
  const dt = ev.target.closest("[data-ds-tab]");
  if (dt) { S.ds.tab = +dt.dataset.dsTab; renderDs(); return; }
  if (ev.target.closest("[data-ds-zoom]")) { S.ds.zoom = !S.ds.zoom; renderDs(); return; }
  const ds = ev.target.closest("[data-ds]");
  if (ds) { ev.stopPropagation(); openDs(ds.dataset.ds); return; }
  const cp = ev.target.closest("[data-copy]");
  if (cp) { ev.stopPropagation(); copyPrompt(cp.dataset.copy, cp.dataset.id); return; }
  const ex = !ev.target.closest("[data-settle]") && ev.target.closest("[data-expand]");
  if (ex) {
    ev.stopPropagation();
    const i = ex.dataset.expand, y = scrollY;
    S.expanded ||= new Set(); S.expanded.has(i) ? S.expanded.delete(i) : S.expanded.add(i);
    render();
    /* render() rebuilds the page and can lose the scroll: stay put, then scroll only as far as needed to show the details */
    const keep = () => {
      scrollTo({ top: y });
      if (S.expanded.has(i)) document.querySelector(`.assumed-list [data-expand="${CSS.escape(i)}"]`)?.closest("li")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    };
    keep(); requestAnimationFrame(keep);
    return;
  }
  const lk = ev.target.closest("[data-looked]");
  if (lk) { const pr = prsToReview().find((x) => prKey(x.ms, x.repo, x.number) === lk.dataset.looked); if (pr) markLooked(pr); return; }
  const st = ev.target.closest("[data-settle]");
  if (st) { ev.stopPropagation(); settle(st.dataset.settle, st.dataset.id); return; }
  const a = ev.target.closest("[data-act]");
  if (a) { ev.stopPropagation(); if (!a.disabled) act(a.dataset.act, a.dataset.id); return; }
  const f = ev.target.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; renderFilters(); applyFilter(); return; }
  const aq = ev.target.closest("[data-asana-ask]");
  if (aq) { enterEpicOf(aq.dataset.asanaAsk); openSheet(S.view === aq.dataset.asanaAsk ? "__root" : aq.dataset.asanaAsk); return; }
  const ad = ev.target.closest("[data-asana-done]");
  if (ad) { asanaDone(ad.dataset.asanaDone, ad.dataset.id); return; }
  if (ev.target.closest("[data-asana-sync]")) { asanaSync(); return; }
  const la = ev.target.closest("[data-link-asana]");
  if (la) { linkAsana(la.dataset.linkAsana || null); return; }
  if (ev.target.closest("[data-digest-done]")) { S.digestSince = null; render(); return; }
  if (ev.target.closest("[data-quest]")) { openSheet("__quest"); return; }
  const es = ev.target.closest("[data-epic-sheet]");
  if (es) { S.epicView = es.dataset.epicSheet; S.epic = epicCtx(S.epicView); S.view = null; openSheet("__root"); return; }
  const narrow = window.matchMedia("(max-width: 1100px)").matches;
  if (ev.target.closest("[data-out]") && !ev.target.closest("[data-drill]")) { setView(null); return; }
  const d = ev.target.closest("[data-drill]");
  if (d) {
    if (narrow) $("feed").classList.remove("on");
    enterEpicOf(d.dataset.drill);
    if (S.epic.single) render(); else setView(d.dataset.drill);
    if (d.dataset.story) openSheet(d.dataset.story);
    if (!d.closest(".map-card")) requestAnimationFrame(() => scrollTo({ top: document.querySelector(".map-card").getBoundingClientRect().top + scrollY - stickyOffset() - 12, behavior: "smooth" }));
    return;
  }
  if (ev.target.closest("[data-back]")) return sheetBack();
  const dc = ev.target.closest("[data-doc]");
  if (dc) return openDoc(dc.dataset.doc, dc.dataset.base);
  const o = ev.target.closest("[data-open]");
  if (o) {
    if (narrow) $("feed").classList.remove("on");
    if (o.dataset.ms !== undefined) {
      enterEpicOf(o.dataset.ms || o.dataset.open);
      if (S.epic && !S.epic.single && (o.dataset.ms || null) !== S.view) { S.view = o.dataset.ms || null; S.filter = "all"; }
    }
    if (S.epic) openSheet(o.dataset.open);
  }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); $("q").focus(); $("q").select(); }
  else if (ev.key === "Escape") {

    else if (S.epic && S.view && !S.epic.single) setView(null);

function stickyOffset() { return parseFloat(getComputedStyle(document.querySelector(".map-head")).top) || 0; }
function trackStickyBar() {

  const sync = () => {
    const barH = getComputedStyle(bar).position === "sticky" ? bar.offsetHeight : 0;
    const next = barH + toolbar.offsetHeight;
    root.style.setProperty("--bar-h", `${barH}px`);
    root.style.setProperty("--toolbar-h", `${toolbar.offsetHeight}px`);
    if (next === offset) return;
