[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podium-dashboard"
version = "0.1.0"
description = "A live localhost dashboard and run-state CLI for agent-orchestrated feature runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
podium = "podium_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["podium_dashboard*"]

[tool.setuptools.package-data]
podium_dashboard = ["podium.html"]
